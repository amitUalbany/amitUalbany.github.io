<svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="700" height="230" fill="#ffffff"/>
  <g>
  <rect x="30" y="20" width="290" height="190" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="175" y="45" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">PREFILL</text>
  <text x="175" y="60" text-anchor="middle" font-size="9" fill="#0d9488">processes the full prompt</text>
  <text x="45" y="82" font-size="9.3" fill="#334155">&#8226; System instructions</text>
  <text x="45" y="98" font-size="9.3" fill="#334155">&#8226; Retrieved evidence</text>
  <text x="45" y="114" font-size="9.3" fill="#334155">&#8226; Conversation history</text>
  <text x="45" y="130" font-size="9.3" fill="#334155">&#8226; User request</text>
  <text x="45" y="152" font-size="9" fill="#0f172a" font-weight="700">Risk introduced here:</text>
  <text x="45" y="167" font-size="8.7" fill="#475569">Evidence surrounded by distractors,</text>
  <text x="45" y="180" font-size="8.7" fill="#475569">placed unfavorably, or duplicated</text>
  <text x="45" y="193" font-size="8.7" fill="#475569">before generation even starts.</text>

  <rect x="380" y="20" width="290" height="190" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="525" y="45" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">DECODE</text>
  <text x="525" y="60" text-anchor="middle" font-size="9" fill="#ea580c">generates one token at a time</text>
  <text x="395" y="82" font-size="9.3" fill="#334155">&#8226; New query per token</text>
  <text x="395" y="98" font-size="9.3" fill="#334155">&#8226; Attends over stored</text>
  <text x="405" y="112" font-size="9.3" fill="#334155">keys &amp; values</text>
  <text x="395" y="152" font-size="9" fill="#0f172a" font-weight="700">Risk expressed here:</text>
  <text x="395" y="167" font-size="8.7" fill="#475569">Every generated token must decide</text>
  <text x="395" y="180" font-size="8.7" fill="#475569">how to use the stored representations</text>
  <text x="395" y="193" font-size="8.7" fill="#475569">&#8212; repeatedly, token after token.</text>
  </g>
  <path d="M320,110 L378,110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
