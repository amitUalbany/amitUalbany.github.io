<svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="700" height="430" fill="#ffffff"/>
  <g font-size="9.6">
  <rect x="150" y="5" width="400" height="34" rx="6" fill="#0f172a"/>
  <text x="350" y="27" text-anchor="middle" fill="#ffffff" font-weight="700">1. User query</text>

  <rect x="150" y="49" width="400" height="34" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="350" y="71" text-anchor="middle" fill="#0f172a" font-weight="700">2. Query understanding &#8212; preserve entities, dates, negation, scope</text>

  <rect x="150" y="93" width="400" height="34" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="350" y="115" text-anchor="middle" fill="#0f172a" font-weight="700">3. Hybrid retrieval &#8212; dense + BM25 + access filters</text>

  <rect x="150" y="137" width="400" height="34" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="350" y="159" text-anchor="middle" fill="#0f172a" font-weight="700">4. Dedup + cross-encoder reranking + facet check</text>

  <rect x="150" y="181" width="400" height="34" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="350" y="203" text-anchor="middle" fill="#0f172a" font-weight="700">5. Context compression &#8212; preserve qualifiers &amp; source IDs</text>

  <rect x="150" y="225" width="400" height="34" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="350" y="247" text-anchor="middle" fill="#0f172a" font-weight="700">6. Context assembly &#8212; U-shaped evidence ordering</text>

  <rect x="150" y="269" width="400" height="34" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="350" y="291" text-anchor="middle" fill="#0f172a" font-weight="700">7. Efficient inference &#8212; KV/prefix cache, PagedAttention, FlashAttn</text>

  <rect x="150" y="313" width="400" height="34" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="350" y="335" text-anchor="middle" fill="#0f172a" font-weight="700">8. Grounded generation &#8212; citations, structure, abstention</text>

  <rect x="150" y="357" width="400" height="34" rx="6" fill="#0f172a"/>
  <text x="350" y="379" text-anchor="middle" fill="#5eead4" font-weight="700">9. Post-generation validation &#8212; claims, citations, consistency</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#a5)">
  <path d="M350,39 L350,47"/>
  <path d="M350,83 L350,91"/>
  <path d="M350,127 L350,135"/>
  <path d="M350,171 L350,179"/>
  <path d="M350,215 L350,223"/>
  <path d="M350,259 L350,267"/>
  <path d="M350,303 L350,311"/>
  <path d="M350,347 L350,355"/>
  </g>
  <defs>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
